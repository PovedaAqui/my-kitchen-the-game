<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gallo Pinto Cook-Off — Host</title>
<style>
  :root {
    --bg: #1a1207; --card: #241a0c; --accent: #e8a13a; --accent2: #b23a2e;
    --green: #4f9d4f; --text: #f6ead4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at 20% 10%, #2b1e0c, var(--bg));
    color: var(--text); min-height: 100vh; padding: 24px;
  }
  header { text-align: center; margin-bottom: 18px; }
  h1 { font-size: 2.4rem; color: var(--accent); letter-spacing: .5px; }
  h1 span { color: var(--accent2); }
  .sub { color: #c9b48c; margin-top: 4px; font-size: 1rem; }
  .wrap { display: grid; grid-template-columns: 340px 1fr; gap: 24px; max-width: 1100px; margin: 0 auto; }
  @media (max-width: 780px){ .wrap{ grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid #3a2c14; border-radius: 16px; padding: 22px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .join-card { text-align: center; }
  .qr { background:#fff; padding:12px; border-radius:12px; display:inline-block; min-height:280px; }
  .qr img { display:block; width:280px; height:280px; }
  .code { font-size: 2.6rem; font-weight: 800; letter-spacing: 8px; color: var(--accent); margin: 14px 0 4px; }
  .joinurl { font-size:.85rem; color:#c9b48c; word-break: break-all; }
  .count { margin-top: 10px; font-size: 1rem; color: var(--green); font-weight:600; }
  .countdown { margin-top: 8px; font-size: 1.5rem; font-weight: 800; color: var(--accent); min-height: 1.5rem; }
  .countdown .num { font-size: 2rem; }
  button { font-family: inherit; cursor: pointer; border: none; border-radius: 10px; padding: 14px 22px; font-size: 1.1rem; font-weight: 700; margin-top: 16px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #1a1207; transition: transform .08s ease, opacity .2s; }
  button:hover { transform: translateY(-2px); }
  button:disabled { opacity: .45; cursor: not-allowed; transform:none; }
  button.secondary { background:#3a2c14; color: var(--text); }
  .board h2 { color: var(--accent); margin-bottom: 12px; font-size: 1.4rem; }
  .player-row { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background:#2c2010; margin-bottom:8px; transition: background .3s; }
  .rank { width:32px; text-align:center; font-weight:800; font-size:1.2rem; color:var(--accent); }
  .pname { flex:0 0 130px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-wrap { flex:1; background:#150f06; border-radius:8px; height:22px; overflow:hidden; position:relative; }
  .bar { height:100%; background:linear-gradient(90deg,var(--green),#7bc47b); width:0%; transition:width .3s ease; }
  .bar-label { position:absolute; right:8px; top:0; line-height:22px; font-size:.8rem; color:#eee; }
  .badge { flex:0 0 auto; font-size:.85rem; padding:3px 9px; border-radius:20px; font-weight:700; }
  .badge.done { background:var(--green); color:#0c1a0c; }
  .badge.cooking { background:#5a4418; color:var(--accent); }
  .badge.off { background:#402020; color:#e0a0a0; }
  .empty { color:#c9b48c; text-align:center; padding:30px; }
  .winner { text-align:center; padding:16px; margin-bottom:14px; background:linear-gradient(135deg,#3a2c14,#4a2a12); border-radius:12px; }
  .winner .big { font-size:1.8rem; color:var(--accent); font-weight:800; }
  .flag { font-size:1.2rem; }
</style>
</head>
<body>
  <header>
    <h1>Gallo Pinto <span>Cook-Off</span> <span class="flag">🇳🇮</span></h1>
    <div class="sub">My Kitchen: The Game — race to cook Nicaragua's national dish</div>
  </header>

  <div class="wrap">
    <div class="card join-card">
      <div class="qr" id="qrBox"><span style="color:#333">Loading…</span></div>
      <div class="code" id="code">····</div>
      <div class="joinurl" id="joinurl"></div>
      <div class="count" id="count">0 / 10 cooks joined</div>
      <div class="countdown" id="countdown"></div>
      <button id="startBtn" disabled>Start now</button>
      <button id="resetBtn" class="secondary" style="display:none">New Round</button>
    </div>

    <div class="card board">
      <h2 id="boardTitle">Kitchen Lobby</h2>
      <div id="winnerBox"></div>
      <div id="players"><div class="empty">Waiting for cooks to scan the QR…</div></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let code = null;
    let phase = 'lobby';

    async function api(path, opts) {
      const r = await fetch(path, opts);
      return r.json();
    }

    async function boot() {
      const res = await api('/api/create', { method: 'POST' });
      code = res.code;
      $('code').textContent = res.code;
      $('joinurl').textContent = res.joinUrl;
      const qrBox = $('qrBox');
      if (res.qr) qrBox.innerHTML = '<img src="' + res.qr + '" alt="Join QR code" />';
      else qrBox.innerHTML = '<span style="color:#333">Open:<br>' + res.joinUrl + '</span>';
      poll();
      setInterval(poll, 700);
    }

    $('startBtn').onclick = async () => {
      $('startBtn').disabled = true;
      const r = await api('/api/start', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ code }) });
      if (!r.ok) { $('startBtn').disabled = false; alert(r.error); }
    };
    $('resetBtn').onclick = async () => {
      await api('/api/reset', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ code }) });
    };

    async function poll() {
      if (!code) return;
      let state;
      try { state = await api('/api/state?code=' + code); } catch { return; }
      if (!state.ok) return;
      phase = state.phase;
      renderBoard(state);
      const n = state.players.length;
      $('count').textContent = n + ' / 10 cooks joined';
      if (phase === 'lobby') {
        $('startBtn').disabled = n === 0;
        $('startBtn').style.display = '';
        $('resetBtn').style.display = 'none';
        if (state.countdownMs != null) {
          const secs = Math.ceil(state.countdownMs / 1000);
          $('countdown').innerHTML = 'Auto-start in <span class="num">' + secs + '</span>s';
          $('boardTitle').textContent = 'Kitchen Lobby — cooks, get ready!';
        } else {
          $('countdown').textContent = '';
          $('boardTitle').textContent = 'Kitchen Lobby';
        }
      } else if (phase === 'playing') {
        $('countdown').textContent = '';
        $('boardTitle').textContent = 'Cooking in progress…';
        $('startBtn').style.display = 'none';
        $('resetBtn').style.display = 'none';
      }
    }

    function renderBoard(state) {
      const showWinner = state.phase === 'finished';
      const el = $('players');
      if (!state.players.length) {
        el.innerHTML = '<div class="empty">Waiting for cooks to scan the QR…</div>';
        return;
      }
      el.innerHTML = state.players.map((p, i) => {
        const pct = Math.round((p.step / p.total) * 100);
        let badge;
        if (!p.connected) badge = '<span class="badge off">left</span>';
        else if (p.finished) badge = '<span class="badge done">' + (p.finishMs/1000).toFixed(1) + 's · ' + p.score + 'pts</span>';
        else if (state.phase === 'playing') badge = '<span class="badge cooking">' + p.step + '/' + p.total + '</span>';
        else badge = '<span class="badge cooking">ready</span>';
        const medal = showWinner && p.finished ? (['🥇','🥈','🥉'][i] || (i+1)+'.') : (i+1);
        return '<div class="player-row"><div class="rank">' + medal + '</div>'
          + '<div class="pname">' + escapeHtml(p.name) + '</div>'
          + '<div class="bar-wrap"><div class="bar" style="width:' + pct + '%"></div>'
          + '<span class="bar-label">' + pct + '%</span></div>' + badge + '</div>';
      }).join('');

      if (showWinner) {
        const winner = state.players.find(p => p.finished);
        if (winner) {
          const nextIn = state.endedAt ? Math.max(0, Math.ceil((state.endedAt + 15000 - (state.serverNow || Date.now())) / 1000)) : null;
          $('winnerBox').innerHTML = '<div class="winner"><div>🏆 Winner</div><div class="big">'
            + escapeHtml(winner.name) + '</div><div>' + (winner.finishMs/1000).toFixed(1)
            + 's · ' + winner.score + ' points</div>'
            + (nextIn != null ? '<div style="margin-top:8px;color:#c9b48c">Next round in ' + nextIn + 's…</div>' : '')
            + '</div>';
        }
        $('boardTitle').textContent = 'Final Results';
        $('countdown').textContent = '';
        $('resetBtn').style.display = 'none';
        $('startBtn').style.display = 'none';
      } else if (state.phase === 'lobby') {
        $('winnerBox').innerHTML = '';
      }
    }

    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    boot();
  </script>
</body>
</html>
